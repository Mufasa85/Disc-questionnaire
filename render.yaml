services:
  - type: web
    name: disc-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: disc-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@disc.local
      - key: ADMIN_PASSWORD
        value: ChangeMe123!
      - key: ADMIN_NAME
        value: Administrateur
      - key: CORS_ORIGIN
        value: https://disc-questionnaire.vercel.app,https://disc-admin.vercel.app
      - key: PORT
        value: 10000

databases:
  - name: disc-db
    databaseName: disc
    user: disc
    plan: free
    region: frankfurt
